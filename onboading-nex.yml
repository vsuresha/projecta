    post {
        failure 
        {
            // in case of failure, we'd like to have simple 'git blame' on build history :)
          script
          {
            currentBuild.displayName = "${JIRA_TICKET_NO}-${emailSubject}"
          } // end of script
        } // end of failure

        success
        {
            // in case of failure, we'd like to have simple 'git blame' on build history :)
          script
          {
            currentBuild.displayName = "${JIRA_TICKET_NO}-${emailSubject}" 
          } // end of script
