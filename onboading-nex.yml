stages 
  {
    
    stage ('Nexus Create app-id') {
      steps
      {
      	script
        {
        withCredentials([
          					//usernamePassword(credentialsId: '76b28bb1-17ca-46ce-be5b-06eb8ad9a9fd', usernameVariable: 'NEXUS_API_USER', passwordVariable: 'NEXUS_API_PASS'),
          					usernamePassword(credentialsId: 'a987b610-41c9-4827-8aec-24d17c25b19c', usernameVariable: 'NEXUS_API_USER', passwordVariable: 'NEXUS_API_PASS')	          
                        ]) 
			{
          	
              
              sh '''
              		#ROLE_ID="1cddabf7fdaa47d6833454af10e0a3ef"
                    #ROLE_ID="1da70fae1fd54d6cb7999871ebdb9a36"
                    echo "${LBU}"
                    echo "${Application}"
                    echo "${JIRA_TICKET_NO}"
                    echo "${requestor_email_id}"
                    APP_ID=${LBU}"-"${Application}
                    echo $APP_ID
                    
                    echo '===================================================================================================================================='
                    echo '===============================================   Get the app ID     =============================================================='
                    echo '===================================================================================================================================='

                    export response=$(curl -k -u ${NEXUS_API_USER}:${NEXUS_API_PASS} -X GET ${NEXUS_URL}/api/v2/applications?publicId=$APP_ID )
                    echo $response

                      if [ $response != '{"applications":[]}' ]
                      then
                      		echo '===================================================================================================================================='
                            echo "The app-id already exists"
                            echo "The app-id already exists">app_id_status_file.txt
                            echo '===================================================================================================================================='
                            echo "\n\n Hello ${requestor_email_id} \n\n As per the onboarding ticket ${JIRA_TICKET_NO} \n\n Nexus app-id is '$APP_ID' already exists. \n Kindly re-run the pipeline with different values.  \n\n For Any queries Kindly contact ${APPSEC_TEAM_EMAIL_ID}  \n\n Thanks, \n\n AppSec Team">emailBodyFile.txt
                            echo "FAILURE: the app-id '$APP_ID' already exists">emailSubjectFile.txt
                            #echo "FAILURE">currentBuildResultFile.txt
                            
                      else
                      		echo '===================================================================================================================================='
                            echo "app-id does not exist. OK to proceed"
                            echo "app-id does not exist. OK to proceed">app_id_status_file.txt
                            echo '===================================================================================================================================='
						fi
                        '''
              		app_id_status = readFile("app_id_status_file.txt")
              
/*    Approval email trigger not required - 

					def approvalUrl = env.BUILD_URL + 'input'
             		def approvalEmailBody = "\n\n Hello AppSec Team Member, \n\n Kindly approve this nexus app id creation pipeline run:$APP_ID \n\n Current status: ${app_id_status} \n\n ${approvalUrl} \n\n For Any queries Kindly contact ${APPSEC_TEAM_EMAIL_ID}  \n\n Thanks, \n\n AppSec Team"
                	mail(
               			to: "${APPROVERS_LIST}",
               			subject: "Nexus app id creation - Approval Required",
               			body: "${approvalEmailBody}"
               	 		)
              			input 	(
                          			message: "Waiting for approval from AppSec Team : ${APPROVERS_LIST} ",
                          			submitter: "${APPROVERS_LIST}"
                          		)
*/
//==================================================================================================================================================================================================================
              		sh '''
                    		echo "${app_id_status}"
                            APP_ID=${LBU}"-"${Application}
                            cat app_id_status_file.txt
              				#if [ "${app_id_status}" != "The app-id already exists" ]
                            if [ $(cat app_id_status_file.txt | grep -c 'OK') == '1' ]
                     		then
                                    echo '===================================================================================================================================='
                                    echo '===============================================   Get the ORG ID     ==============================================================='
                                    echo '===================================================================================================================================='

                                    export orgid=$(curl -k -u ${NEXUS_API_USER}:${NEXUS_API_PASS} -X GET ${NEXUS_URL}/api/v2/organizations | jq -r '.' | grep -B 1 ${LBU} | grep -m 1 id | xargs | cut -d " " -f 2 | cut -d "," -f 1)
                                    echo ${orgid}

                                    #export orgid=$(curl -k -u ${NEXUS_API_USER}:${NEXUS_API_PASS} -X GET ${NEXUS_URL}/api/v2/organizations | jq -r 'if .organizations[].name == "test" then')
                                    #echo ${orgid}

                                    echo '===================================================================================================================================='
                                    echo '===============================================   Create an app-id     ============================================================='
                                    echo '===================================================================================================================================='

                                    curl -k \
                                                -u ${NEXUS_API_USER}:${NEXUS_API_PASS} \
                                                -X POST -H "Content-Type: application/json" \
                                                -d '{"publicId": "'$APP_ID'","name": "'$APP_ID'","organizationId":"'${orgid}'","contactUserName":"'${NEXUS_API_USER}'","applicationTags": [{"tagId":"cfc9bbddd5354e75afc4fdb2fa8394a3"}]}' \
                                                ${NEXUS_URL}/api/v2/applications
                                    #cat status.txt
                                    echo '================================================================================'
                                    echo "created app id is:  "$APP_ID
                                    echo '================================================================================'

                                    echo '===================================================================================================================================='
                                    echo '===============================================   Get the app ID     =============================================================='
                                    echo '===================================================================================================================================='

                                    export APP_ID_NO=$(curl -k -u ${NEXUS_API_USER}:${NEXUS_API_PASS} -X GET ${NEXUS_URL}/api/v2/applications?publicId=$APP_ID | jq -r '.applications[].id')

                                    #echo '===================================================================================================================================='
                                    #echo '===============================================  Assign access to user ============================================================='
                                    #echo '===================================================================================================================================='

                                    #curl -k \
                                    #            -u ${NEXUS_API_USER}:${NEXUS_API_PASS} \
                                    #            -X PUT -H "Content-Type: application/json" \
                                    #             ${NEXUS_URL}/api/v2/roleMemberships/application/$APP_ID_NO/role/${ROLE_ID}/user/${PRUASIA_ID}

                                    #echo '===================================================================================================================================='
                                    #echo '===============================================   Get the app ID     ==============================================================='
                                    #echo '===================================================================================================================================='

                                    #export id=$(curl -k -u ${NEXUS_API_USER}:${NEXUS_API_PASS} -X GET ${NEXUS_URL}/api/v2/applications?publicId=testapp3 | jq -r '.applications[].id')
                                    #echo ${id}

                                    echo "\n\n Hello ${requestor_email_id} \n\n As per the onboarding ticket ${JIRA_TICKET_NO} \n\n Nexus app-id '$APP_ID' has been created  \n\n Kindly refer this page for Nexus Self-Onboarding steps : ${NEXUS_ONBOARDING_GUIDE_LINK}  \n\n Kindly raise an IAMPRU request to get access to the nexus reports : https://iam.pru.intranet.asia  \n\n For Any queries Kindly contact ${APPSEC_TEAM_EMAIL_ID}  \n\n Thanks, \n\n AppSec Team">emailBodyFile.txt
                                    echo "SUCCESS: Nexus app-id '$APP_ID' has been created">emailSubjectFile.txt
                                    #echo "SUCCESS">currentBuildResultFile.txt
                         fi   
              '''
              emailBody =  readFile("emailBodyFile.txt")
              emailSubject = readFile("emailSubjectFile.txt")
              //currentBuild.result = readFile("currentBuildResultFile.txt")
            //emailBody = "\n\n Hello ${requestor_email_id} \n\n As per the onboarding ticket${JIRA_TICKET_NO} \n\n Nexus app-id is '$APP_ID' has been created  \n\n Kindly refer this page for Nexus Self-Onboarding steps : ${NEXUS_ONBOARDING_GUIDE_LINK}  \n\n ${PRUASIA_ID} has been granted access to the application \n\n For Any queries Kindly contact ${APPSEC_TEAM_EMAIL_ID}  \n\n Thanks, \n\n AppSec Team"
             mail(
               			to: "${APPROVERS_LIST},${requestor_email_id}",
               			subject: "${JIRA_TICKET_NO}: ${emailSubject}",
               			body: "${emailBody}"
               	 )		
                        //mime: "text/html");
              
        	} //end of withCredentials
        } //end of script
      } //end of steps
    } // end of stage Nexus

